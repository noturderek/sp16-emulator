name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No firmware, keys or images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse files that must never be committed
        run: |
          found=$(git ls-files | grep -iE '\.(upd|key|sqfs|img|iso|sfs|mot|zip|tgz|tar\.gz|wav|aiff?|prj)$|(^|/)(build|private)/|(^|/)PIONEER DJ SAMPLER/|(^|/)emulator/mods/' || true)
          if [ -n "$found" ]; then
            echo "::error::These files must not be committed (firmware, keys, images, audio, archives or shipped mods):"
            echo "$found"
            exit 1
          fi

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    # Apple silicon with Xcode: some tests compile and run small Swift harnesses. No firmware, Docker or network needed.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install coverage.py and the optional test packages
        run: python -m pip install coverage numpy pillow
      - name: Run the firmware-free unit tests with coverage
        run: ./sp16 --python "$(command -v python)" test --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/.coverage ]; then
            { echo "### Coverage (Python ${{ matrix.python }})"; echo
              python -m coverage report --data-file build/coverage/.coverage --format=markdown --skip-empty --sort=cover
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage.xml
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/coverage/coverage.xml
          if-no-files-found: ignore
